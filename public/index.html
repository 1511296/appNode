<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-4 text-center">Lista de Usuarios</h1>
    <ul id="userList" class="space-y-2 mb-6"></ul>

    <form id="userForm" class="flex gap-2">
      <input id="nameInput" type="text" placeholder="Nuevo usuario" required
        class="flex-1 border px-3 py-2 rounded shadow-sm focus:outline-none focus:ring"/>
      <button type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Agregar</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
